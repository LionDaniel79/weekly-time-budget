<!doctype html>
<html lang="ko" data-app-build="2026.08.07-runtime-reset-v24">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#173b33" />
  <meta name="apple-mobile-web-app-title" content="주간 시간 예산" />
  <title>주간 시간 예산</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png?v=24" />
  <link rel="manifest" href="./manifest.webmanifest?v=24" />
  <link rel="stylesheet" href="./styles.css?v=24" />
  <link rel="stylesheet" href="./src/mobile-compact.css?v=24" />
  <link rel="stylesheet" href="./src/statistics-primary.css?v=24" />
</head>
<body>
  <section id="login-view" class="login-view">
    <div class="login-card">
      <p class="eyebrow">LYUBISHCHEV TIME SYSTEM</p>
      <h1>주간 시간 예산</h1>
      <p>월요일부터 주일까지 실제 사용 시간을 기록하고, 삶의 중요한 영역에 시간을 충분히 배정했는지 확인합니다.</p>
      <button id="google-login" class="primary-button">Google로 시작하기</button>
      <p id="config-warning" class="warning hidden">Firebase 설정이 필요합니다. README의 설정 방법을 확인하세요.</p>
      <small class="muted" data-build-label>앱 버전 v24</small>
    </div>
  </section>

  <div id="app-view" class="app-shell hidden">
    <aside class="sidebar" id="app-navigation">
      <div><p class="eyebrow">TIME BUDGET</p><h2>나의 시간 연구</h2></div>
      <nav>
        <button data-view="dashboard" class="nav-button active">대시보드</button>
        <button data-view="record" class="nav-button">시간 기록</button>
        <button data-view="budget" class="nav-button">시간 예산</button>
        <button data-view="history" class="nav-button">기록 내역</button>
        <button data-view="statistics" class="nav-button">통계</button>
        <button data-view="categories" class="nav-button">대분류 관리</button>
      </nav>
      <div class="profile-box"><span id="user-name">사용자</span><small class="muted" data-build-label>앱 버전 v24</small><button id="logout" class="text-button">로그아웃</button></div>
    </aside>
    <main class="main-content">
      <header class="topbar"><div><p id="week-label" class="eyebrow"></p><h1 id="page-title">대시보드</h1></div><button id="mobile-menu" class="mobile-menu" aria-expanded="false" aria-controls="app-navigation">메뉴</button></header>
      <section id="dashboard-view" class="view"></section><section id="record-view" class="view hidden"></section><section id="budget-view" class="view hidden"></section><section id="history-view" class="view hidden"></section><section id="statistics-view" class="view hidden"></section><section id="categories-view" class="view hidden"></section>
    </main>
  </div>
  <template id="empty-template"><div class="empty-state"><h3>아직 등록된 대분류가 없습니다.</h3><p>대분류 관리에서 논문, 설교, 기도, 운동처럼 시간을 관리할 영역을 등록하세요.</p></div></template>
  <script type="module" src="./src/service-worker-registration.js?v=24"></script>
  <script type="module" src="./src/local-timer-removal-reload.js?v=24"></script>
  <script type="module" src="./src/category-delete-guard.js?v=24"></script>
  <script type="module" src="./src/orphan-local-timer-cleanup.js?v=24"></script>
  <script type="module" src="./src/record-feature.js?v=24"></script>
  <script type="module" src="./src/history-feature.js?v=24"></script>
  <script type="module" src="./src/category-feature.js?v=24"></script>
  <script type="module" src="./src/app-shell.js?v=24"></script>
  <script type="module" src="./src/auth-feature.js?v=24"></script>
  <script type="module" src="./src/app.js?v=24"></script>
  <script type="module" src="./src/view-change-events.js?v=24"></script>
  <script type="module" src="./src/auth-login-guard.js?v=24"></script>
  <script type="module" src="./src/statistics-bootstrap.js?v=24"></script>
  <script type="module" src="./src/category-selection-memory.js?v=24"></script>
  <script type="module" src="./src/previous-results-budget-migration.js?v=24"></script>
  <script type="module" src="./src/time-budget-feature.js?v=24"></script>
  <script type="module" src="./src/persistent-timer-ui.js?v=24"></script>
</body>
</html>
