<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Statistics feature</title></head>
<body>
  <section id="statistics-view"></section>
  <script type="module">
    import { createStatisticsFeature } from '/src/statistics-feature.js';
    import { fixtureByName } from '/tests/browser/support/statistics-fixtures.mjs';

    const fixture = fixtureByName(new URLSearchParams(location.search).get('fixture') || 'restraint');
    const counts = { cacheReads: 0, serverReads: 0, saves: 0 };
    const diagnostics = { modeChanges: 0, aggregateRuns: 0, renderRuns: 0, stateSaves: 0 };
    const dataSource = {
      async load(_userId, { onCache, onServer }) {
        counts.cacheReads += 1;
        await onCache({ data: fixture.data, dataVersion: 'cache:1', source: 'cache', warning: '' });
        counts.serverReads += 1;
        await onServer({ data: fixture.data, dataVersion: 'server:2', source: 'server', warning: '' });
        return { data: fixture.data, dataVersion: 'server:2', source: 'server', warning: '' };
      },
    };
    const feature = createStatisticsFeature({
      root: document.querySelector('#statistics-view'),
      dataSource,
      getCurrentUser: () => ({ uid: 'browser-user' }),
      saveUiState: async () => { counts.saves += 1; },
      setHeader: () => {},
      now: () => new Date('2026-08-02T12:00:00'),
      diagnostics,
    });
    feature.restore(fixture.restored);
    globalThis.__statisticsHarness = { feature, counts, diagnostics, fixture, ready: feature.enter() };
  </script>
</body>
</html>
