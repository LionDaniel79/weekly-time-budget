name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate release modules
        run: |
          node --check src/app-shell.js
          node --check src/statistics-bootstrap.js
          node --check src/statistics-state.js
          node --check src/statistics-feature.js
          node --check src/service-worker-registration.js
          node --check service-worker.js

      - name: Run runtime stability regression tests
        run: node --test tests/runtime-navigation-statistics-stability.test.js

      - name: Verify release source contracts
        run: |
          grep -q '2026.08.07-stability-v25' index.html
          grep -q '2026.08.07-stability-v25' service-worker.js
          grep -q '앱 버전 v25' index.html
          grep -q 'validWeekStart' src/statistics-state.js
          ! grep -q 'coerceRecordedPeriodSelection' src/statistics-state.js
          grep -q 'refreshQueued' src/statistics-bootstrap.js
          grep -q "closest?.('#mobile-menu')" src/app-shell.js

      - name: Prepare Pages artifact
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET || vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID || vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || vars.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID || vars.FIREBASE_MEASUREMENT_ID }}
        run: npm run prepare:pages

      - name: Verify deployed build contents
        run: |
          grep -q '2026.08.07-stability-v25' _site/index.html
          grep -q '2026.08.07-stability-v25' _site/service-worker.js
          grep -q '앱 버전 v25' _site/index.html
          grep -q 'validWeekStart' _site/src/statistics-state.js
          grep -q 'refreshQueued' _site/src/statistics-bootstrap.js
          grep -q "closest?.('#mobile-menu')" _site/src/app-shell.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
