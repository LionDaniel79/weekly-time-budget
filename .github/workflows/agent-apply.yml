name: Agent Apply Patch

on:
  push:
    branches: [feat/restraint-goals]

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'agent: queue patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/restraint-goals
          fetch-depth: 0
      - name: Apply queued patch
        run: |
          commit_message="$(cat .agent/commit-message.txt)"
          git apply --whitespace=fix .agent/queued.patch
          rm -rf .agent
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$commit_message"
          git push origin HEAD:feat/restraint-goals
