name: Apply dashboard archive filter

on:
  push:
    branches: [fix/hide-archived-category-current-dashboard]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'chore: add one-time dashboard archive patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hide-archived-category-current-dashboard
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-dashboard-archive-filter.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: filter archived categories by dashboard period"
          git push
