name: Agent Apply Category Effective Date

on:
  push:
    branches: [feat/category-effective-date]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'agent: apply category effective date implementation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/category-effective-date
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply implementation
        run: node scripts/agent-apply-category-effective-date.mjs
      - name: Verify implementation
        run: npm test
      - name: Remove temporary agent files
        run: |
          rm scripts/agent-apply-category-effective-date.mjs
          rm .github/workflows/agent-apply-category-effective-date.yml
      - name: Commit implementation
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: apply category effective dates"
          git push origin HEAD:feat/category-effective-date
