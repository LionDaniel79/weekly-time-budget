name: Patch monthly statistics observer ownership

on:
  push:
    branches: [fix/monthly-statistics-observer-ownership]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monthly-statistics-observer-ownership
      - name: Apply focused monthly ownership fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/recorded-period-navigation.js')
          source = path.read_text()

          old_patch = """function patchMonthlyStatistics(view) {
            if (!view.querySelector('[data-rescue-stat-mode=\"monthly\"].active')) return;
          """
          new_patch = """function patchMonthlyStatistics(view) {
            if (view.dataset.statisticsRescue !== undefined) return;
            if (!view.querySelector('[data-rescue-stat-mode=\"monthly\"].active')) return;
          """
          if old_patch not in source:
              raise SystemExit('monthly patch anchor not found')
          source = source.replace(old_patch, new_patch, 1)

          old_change = """document.addEventListener('change', (event) => {
            if (!event.target.matches('#statistics-rescue-year, #statistics-rescue-month')) return;
            if (blockUntilPeriodsReady(event)) return;
            const view = document.querySelector('#statistics-view');
          """
          new_change = """document.addEventListener('change', (event) => {
            if (!event.target.matches('#statistics-rescue-year, #statistics-rescue-month')) return;
            const ownedView = document.querySelector('#statistics-view');
            if (ownedView?.dataset.statisticsRescue !== undefined) return;
            if (blockUntilPeriodsReady(event)) return;
            const view = ownedView;
          """
          if old_change not in source:
              raise SystemExit('monthly change anchor not found')
          source = source.replace(old_change, new_change, 1)
          path.write_text(source)

          cache_targets = [Path('service-worker.js'), *Path('tests').glob('*.test.js')]
          replacements = 0
          for target in cache_targets:
              text = target.read_text()
              updated = text.replace('weekly-time-budget-shell-v14', 'weekly-time-budget-shell-v15')
              if updated != text:
                  target.write_text(updated)
                  replacements += 1
          if replacements == 0:
              raise SystemExit('v14 cache references not found')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recorded-period-navigation.js service-worker.js tests
          git commit -m "fix: give monthly controls to primary statistics renderer"
          git push
